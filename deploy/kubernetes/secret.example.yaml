# EXAMPLE ONLY - not part of the kustomization. Do not commit real hashes.
#
# The hub reads a JSON object from node name to the lowercase hex SHA-256 of
# that node's token. Tokens stay on the nodes; the hub sees only hashes.
# Generate a token and its hash on each node (see docs/operations.md, Tokens):
#
#   umask 077; mkdir -p ~/.config/rookery
#   python3 -c 'import secrets; print(secrets.token_urlsafe(32))' > ~/.config/rookery/token
#   python3 -c 'import hashlib,sys; print(hashlib.sha256(open(sys.argv[1]).read().strip().encode()).hexdigest())' \
#     ~/.config/rookery/token
#
# Then either edit and apply this file, or (preferred, nothing on disk in git):
#
#   kubectl -n rookery create secret generic rookery-hub-tokens \
#     --from-file=tokens.json=./tokens.json
#
# The placeholders below are deliberately invalid: a malformed entry makes the
# hub reject every token, so an unedited copy fails closed. The hub rereads the
# file on each request; the kubelet refreshes Secret volumes within about a
# minute, so rotation and revocation need no restart.
apiVersion: v1
kind: Secret
metadata:
  name: rookery-hub-tokens
  namespace: rookery
type: Opaque
stringData:
  tokens.json: |
    {
      "alpha": "REPLACE-WITH-64-LOWERCASE-HEX-SHA256-OF-ALPHA-TOKEN",
      "beta": "REPLACE-WITH-64-LOWERCASE-HEX-SHA256-OF-BETA-TOKEN"
    }
