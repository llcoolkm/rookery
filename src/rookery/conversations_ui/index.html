<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conversations · Rookery</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" type="module"></script>
</head>
<body>
  <header class="topbar">
    <span class="brand">Rookery hub</span>
    <h1 id="dashboard-title" class="visually-hidden">Conversations</h1>
    <nav class="dashboard-nav" aria-label="Rookery hub">
      <a href="#conversations" id="conversations-link" aria-current="page">Conversations</a>
      <a href="#sessions" id="sessions-link">Sessions</a>
    </nav>
    <button type="button" id="refresh" class="button">Refresh</button>
  </header>

  <main class="workspace">
    <aside class="threads" aria-labelledby="threads-title">
      <div class="threads-header">
        <h2 id="threads-title">Threads</h2>
        <form id="filters" class="filters" role="search" aria-label="Filter threads">
          <label>Host <input name="host" type="text" maxlength="128" autocomplete="off" spellcheck="false"></label>
          <label>Agent <input name="agent" type="text" maxlength="128" autocomplete="off" spellcheck="false"></label>
          <label>Status
            <select name="status">
              <option value="">All statuses</option>
              <option value="pending">Pending</option>
              <option value="read">Read</option>
              <option value="dispatching">Dispatching</option>
              <option value="submitted">Submitted</option>
              <option value="uncertain">Uncertain</option>
              <option value="failed">Failed</option>
              <option value="acknowledged">Acknowledged</option>
              <option value="replied">Replied</option>
              <option value="expired">Expired</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </label>
          <button type="submit" class="button apply">Apply filters</button>
        </form>
      </div>
      <div class="thread-scroll">
        <p id="list-feedback" class="feedback" role="status">Loading threads…</p>
        <ul id="thread-list" class="thread-list"></ul>
        <button type="button" id="load-older" class="button load-older" hidden>Load older threads</button>
      </div>
    </aside>

    <section class="transcript" aria-labelledby="transcript-title">
      <div class="transcript-header">
        <button type="button" id="back" class="button back">Back to threads</button>
        <h2 id="transcript-title" tabindex="-1">Transcript</h2>
        <p id="participants" class="participants" hidden></p>
      </div>
      <div id="transcript-scroll" class="transcript-scroll">
        <p id="transcript-feedback" class="feedback" role="status">Select a thread to read its messages.</p>
        <ol id="messages" class="messages"></ol>
      </div>
    </section>
  </main>

  <main class="session-view" id="session-view" aria-labelledby="session-title" hidden>
    <div class="session-header">
      <h2 id="session-title">Agent sessions</h2>
      <label class="offline-toggle"><input type="checkbox" id="show-offline"> Show offline sessions</label>
    </div>
    <ul id="node-counts" class="node-counts" aria-label="Sessions per node"></ul>
    <p id="session-feedback" class="feedback session-feedback" role="status">Loading sessions…</p>
    <div id="session-table-scroll" class="session-table-scroll" role="region" aria-label="Session details" tabindex="0" hidden>
      <table class="session-table" aria-labelledby="session-title">
        <thead>
          <tr>
            <th scope="col">Node</th>
            <th scope="col">Provider</th>
            <th scope="col">Name</th>
            <th scope="col">Status</th>
            <th scope="col">Waiting for</th>
            <th scope="col">Since change</th>
            <th scope="col">tmux</th>
            <th scope="col">Working directory</th>
          </tr>
        </thead>
        <tbody id="session-rows"></tbody>
      </table>
    </div>
  </main>
</body>
</html>
