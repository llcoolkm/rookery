[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "rookery-agents"
version = "0.3.1"
description = "Reliable messaging between Codex, Claude Code and Antigravity sessions on Linux and WSL"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "llcoolkm" }]
keywords = ["agents", "claude-code", "codex", "antigravity", "mcp", "messaging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications",
    "Topic :: Software Development",
]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/llcoolkm/rookery"
Repository = "https://github.com/llcoolkm/rookery"
Issues = "https://github.com/llcoolkm/rookery/issues"

[project.optional-dependencies]
hub = ["uvicorn>=0.30,<1"]

[project.scripts]
rookery = "rookery.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rookery"]

# Allowlist: private notes (docs/release.md, docs/test-drive.md and the release
# plan) must never ship in an sdist.
[tool.hatch.build.targets.sdist]
include = [
    "/src/rookery",
    "/tests",
    "/scripts",
    "/integrations",
    "/service",
    "/assets",
    "/bin",
    "/deploy",
    "/docs/operations.md",
    "/docs/design.md",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/THREAT_MODEL.md",
    "/SECURITY.md",
    "/Dockerfile",
    "/.dockerignore",
    "/.github",
    "/pyproject.toml",
    "/uv.lock",
]
